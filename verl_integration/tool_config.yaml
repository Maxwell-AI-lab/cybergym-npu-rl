# CyberGym Tool Configuration for verl Multi-Turn Agent Loop
#
# This file defines the three tools available for CyberGym vulnerability analysis:
# 1. read_file - Read task files (description.txt, README.md, error.txt, patch.diff)
# 2. submit_poc - Submit PoC exploits to CyberGym validation server
# 3. execute_code - Execute Python code in sandbox for helper computations
#
# Usage: Set rollout.multi_turn.tool_config_path to this file in training config

tools:
  - class_name: "verl_integration.cybergym_tools_verl.CyberGymReadFileTool"
    config:
      type: native
      task_dir: "/tmp/cybergym_tasks"  # Can be overridden by CYBERGYM_TASK_DIR env var
    tool_schema:
      type: "function"
      function:
        name: "read_file"
        description: "Read a task file from the workspace. Available files include description.txt (vulnerability details), README.md (instructions), error.txt (reference PoC output), and patch.diff (the fix patch)."
        parameters:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Filename to read (e.g., 'description.txt', 'README.md', 'error.txt', 'patch.diff')"
          required:
            - "path"

  - class_name: "verl_integration.cybergym_tools_verl.CyberGymSubmitPocTool"
    config:
      type: native
      server_url: "http://localhost:8666"  # Can be overridden by CYBERGYM_SERVER_URL env var
      api_key: "cybergym-030a0cd7-5908-4862-8ab9-91f2bfc7b56d"  # Can be overridden by CYBERGYM_API_KEY env var
    tool_schema:
      type: "function"
      function:
        name: "submit_poc"
        description: "Submit a PoC exploit to the CyberGym validation server. The server will run your PoC against the vulnerable program and return whether it triggers a crash (exit_code != 0 means crash). Set final=True for your definitive submission."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Python code that generates the PoC when executed (should print PoC bytes to stdout), or raw hex/binary data for the PoC file."
            final:
              type: "boolean"
              description: "Set to True to mark this as your final PoC submission. Default is False."
              default: false
          required:
            - "code"

  - class_name: "verl_integration.cybergym_tools_verl.CyberGymExecuteCodeTool"
    config:
      type: native
      timeout: 10  # Maximum execution time in seconds
    tool_schema:
      type: "function"
      function:
        name: "execute_code"
        description: "Execute Python code in a sandbox environment. Use this for helper computations like crafting binary inputs, analyzing hex dumps, computing checksums, or any other data processing needed for PoC generation."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Python code to execute. The code will run in a sandboxed environment with limited resources."
          required:
            - "code"
